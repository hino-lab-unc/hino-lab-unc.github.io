        <p>Dr. Russell Blessing is an urban resilience scientist with a focus on natural hazard mitigation. He received his Ph.D. in Urban & Regional Science and a Master’s in Urban Planning from Texas A&M University.</p>
        <p>Dr. Blessing's research includes disaster resilience, flood risk management, and climate change adaption. Most recently, he was a Research Scientist at Texas A&M's Institute for a Disaster Resilient Texas from 2019 to 2024. His work has been published in peer-reviewed journals and recognized by national media and Texas water and hazard decision makers for its impact on flood risk communication and resilience planning.</p>