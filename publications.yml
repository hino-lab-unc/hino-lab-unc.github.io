- title: Promoting Equity in Retreat through Voluntary Property Buyout Programs
  authors: Caroline M. Kraan,  <b>Miyuki Hino</b>,  Jennifer Niemann,  A. R. Siders,   Katharine J. Mach
  date: 2021-09
  subtitle: Journal of Environmental Studies and Sciences
  # shortjournal: J. Environ. Stud. Sci.
  # volume: 11
  # number: 3
  # pages: 481--492
  # issn: 2190-6483, 2190-6491
  doi: 10.1007/s13412-021-00688-z
  path: https://link.springer.com/10.1007/s13412-021-00688-z
  # urldate: 2026-07-23
  # abstract: # abstract             Voluntary property buyouts have been the most prevalent form of managed retreat in the USA to date. Tens of thousands of households have sold their flood-prone homes to the government, and after the structures are demolished, the land becomes open space. Concerns have been raised about the equity of buyout processes and outcomes, spanning distributive, procedural, and interactional dimensions of social justice. In this policy analysis, we first provide an overview of equity and justice issues in buyouts based on existing literature. We consider multiple relevant stakeholder groups: the communities in which buyouts occur, potential participants and relocating households, residents who choose to stay, and the destination communities. Second, we present policy options that may address and reduce existing social inequities in buyouts. Third, we outline how improved reporting on buyout programs by implementers can support buyout policy learning that will improve buyout outcomes and equity. Indicators can provide insight on who has access to buyouts, the effect of buyout implementation on outcomes, and the consequences of relocating—or not—for all affected. With increasing climate risks, voluntary property buyouts will remain an important means of reducing exposure to flooding and other hazards. For this method of retreat to occur effectively at greater scale, attention to social justice in program evaluation and policy learning is necessary.
  # langid: english



