- title: Fecal Bacteria Contamination of Floodwaters and a Coastal Waterway From Tidally-Driven Stormwater Network Inundation
  authors: M. M. Carr,  A. C. Gold,   A. Harris, K. Anarde, <b>M. Hino</b>,   N. Sauers, G. Da Silva, C. Gamewell,  N. G. Nelson
  date: 2024-04
  subtitle: GeoHealth
  # volume: 8
  # number: 4
  # pages: e2024GH001020
  # issn: 2471-1403, 2471-1403
